name: admin_panel
description: "Flutter eCommerce Admin Panel - Standalone Web & Desktop Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.6.6

  # Supabase Backend
  supabase_flutter: ^2.8.0

  # Icons & Fonts
  iconsax: ^0.0.8
  google_fonts: ^6.2.1

  # Responsive Data Tables & Analytics Charts
  data_table_2: ^2.5.10
  fl_chart: ^0.68.0

  # Local Persistence
  get_storage: ^2.1.1

  # File & Image Uploading
  file_picker: ^8.0.5

  # Formatting & Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/brands/
